# Render Blueprint for the public MIRROR demo: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repository. Render asks for ASSEMBLYAI_API_KEY; everything else is set here.
services:
  - type: web
    name: mirror
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      # Secrets: the AssemblyAI key is entered in Render's dashboard; the commit-token key is generated by Render.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: MIRROR_COMMIT_SECRET
        generateValue: true
      # Public-demo guardrails (docs/deploy.md).
      - key: MIRROR_SANDBOX_PER_SESSION
        value: "true"
      - key: MIRROR_RATE_LIMIT
        value: "true"
      - key: MIRROR_PROXY_HOPS
        value: "1"
      - key: VOICE_MAX_SESSION_SECONDS
        value: "300"
      - key: VOICE_MAX_CONCURRENT
        value: "3"
      - key: VOICE_DAILY_BUDGET_SECONDS
        value: "5400"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_FAULT_INJECTION
        value: "true"
      - key: ASSEMBLYAI_VOICE
        value: anna
      - key: LLM_GATEWAY_ENABLED
        value: "true"
      - key: LLM_GATEWAY_MODEL
        value: qwen3.5-4b-32k-fast
      - key: MIRROR_CORS_ORIGINS
        value: ""
